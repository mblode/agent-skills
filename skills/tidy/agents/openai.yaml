interface:
  display_name: "Local Review"
  short_description: "Read-only review of the local diff before commit, push, or handoff"
  default_prompt: "Review the current local diff (or the branch diff against its merge base with the default branch if the working tree is clean) as a read-only second opinion. Look for: code that fails to compile or calls a symbol the installed dependency does not export, incorrect behavior, a removed guard or validation that nothing re-establishes, a caught error the caller never sees, a concrete security risk with a direct exploit path, a bug fix with no failing repro test, and an unambiguous repository instruction-file violation with the rule quoted. For each finding give file:line taken from the file itself (not the hunk header), a one-sentence factual impact, a committable fix, and a verdict: confirmed (you can name the triggering input and the wrong output) or plausible (real mechanism, uncertain trigger; say what would confirm it). Report both; the caller re-verdicts everything. Do not edit any files. Skip style preferences, linter-only noise, and pre-existing issues outside any touched function."

policy:
  allow_implicit_invocation: false
