# One agent task per dispatch: reland, conflict or flake. The agent job runs
# agent-written code, so it holds a read-only token and the model key only; the
# publish job runs no repository code from the agent, checks the change, and pushes
# with the App token. Swap the agent job for a POST to eve or Devin if the agent
# lives there; keep publish, because its checks are the guarantee.
name: agent-task
run-name: agent-task ${{ inputs.kind }} pr=${{ inputs.pr }} check=${{ inputs.check }} sha=${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [reland, conflict, flake]
        required: true
      check:
        type: string
      sha:
        type: string
      pr:
        type: string
      evidence:
        description: URL of the failing run
        type: string

concurrency:
  group: agent-task-${{ inputs.kind }}-${{ inputs.check }}-${{ inputs.sha }}-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MERGE_LOOP_RUNG: ${{ vars.MERGE_LOOP_RUNG || '0' }}

jobs:
  agent:
    # Re-lands start at rung 2, conflict and flake repair at rung 4; 0 is the kill switch.
    if: >-
      fromJSON(vars.MERGE_LOOP_RUNG || '0') >= 4 ||
      (inputs.kind == 'reland' && fromJSON(vars.MERGE_LOOP_RUNG || '0') >= 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Copy the controller before the tree changes to agent-authored content.
      - run: cp .github/merge-loop/loop.sh .github/merge-loop.json "$RUNNER_TEMP/"
      - env:
          GH_TOKEN: ${{ github.token }}
          MERGE_LOOP_CONFIG: ${{ runner.temp }}/merge-loop.json
          KIND: ${{ inputs.kind }}
          CHECK: ${{ inputs.check }}
          SHA: ${{ inputs.sha }}
          PR: ${{ inputs.pr }}
          EVIDENCE: ${{ inputs.evidence }}
        run: |
          git config user.name "merge-loop"
          git config user.email "merge-loop@users.noreply.github.com"
          bash "$RUNNER_TEMP/loop.sh" prepare "$KIND" "$CHECK" "$SHA" "$PR" "$EVIDENCE"
      - uses: ./.github/actions/setup
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MERGE_LOOP_CONFIG: ${{ runner.temp }}/merge-loop.json
        run: |
          cfg="$RUNNER_TEMP/merge-loop.json"
          prompt=$(bash "$RUNNER_TEMP/loop.sh" prompt)
          npx -y @anthropic-ai/claude-code@2.1.308 -p "$prompt" \
            --permission-mode acceptEdits \
            --allowedTools "$(jq -r .agents.allowed_tools "$cfg")" \
            --max-budget-usd "$(jq -r .agents.max_budget_usd "$cfg")" \
            --output-format json > "$RUNNER_TEMP/agent.json"
          jq -r '.result // empty' "$RUNNER_TEMP/agent.json" >> "$GITHUB_STEP_SUMMARY"
      - id: commit
        env:
          KIND: ${{ inputs.kind }}
        run: |
          git add -A
          if [ "$KIND" = conflict ] && git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          elif git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          else
            git commit -m "$(jq -r '"merge-loop \(.kind): \(.check) \(.sha) \(.pr)"' "$RUNNER_TEMP/meta.json")"
          fi
          git bundle create "$RUNNER_TEMP/work.bundle" HEAD ^origin/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-work
          path: ${{ runner.temp }}/work.bundle

  publish:
    needs: agent
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_LOOP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_LOOP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/download-artifact@v8
        with:
          name: agent-work
          path: ${{ runner.temp }}/work
      # Only the bundle comes from the agent job; everything else is the dispatch inputs.
      - env:
          GH_TOKEN: ${{ github.token }}
          LOOP_TOKEN: ${{ steps.app.outputs.token }}
          KIND: ${{ inputs.kind }}
          CHECK: ${{ inputs.check }}
          SHA: ${{ inputs.sha }}
          PR: ${{ inputs.pr }}
          EVIDENCE: ${{ inputs.evidence }}
        run: bash .github/merge-loop/loop.sh publish "$KIND" "$CHECK" "$SHA" "$PR" "$EVIDENCE" "$RUNNER_TEMP/work/work.bundle"
