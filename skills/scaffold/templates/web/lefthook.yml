# Lives at the repo root, next to .git: git never reads a copy inside a workspace.
# `root` scopes each job to the workspace, so staged paths arrive relative to the
# directory holding oxlint.config.ts and oxfmt.config.ts.
#
# Two jobs, not `ultracite fix`: ultracite exits non-zero when the staged set has
# no lintable JS/TS file, so a CSS-only or docs-only commit would fail outright.
# Separate globs let lefthook skip whichever job has nothing to do.
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      root: "apps/web/"
      # Matches what `format:check` inspects, markdown included.
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.md"
        - "*.mdx"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true
    - name: oxlint
      root: "apps/web/"
      glob: "*.{js,jsx,ts,tsx}"
      run: npx oxlint --fix {staged_files}
      stage_fixed: true
