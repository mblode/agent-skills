# .github/workflows/ci.yml
# Resolve {{checkout_action}}, {{setup_node_action}}, and {{node_major}} live.
# Release and publish workflows (changesets, OIDC trusted publishing) are added
# by the ship skill, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: {{checkout_action}}
      - uses: {{setup_node_action}}
        with:
          node-version: {{node_major}}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Manifest points at emitted files
        run: |
          head -1 dist/cli.js | grep -qx '#!/usr/bin/env node'
          test -f dist/index.js && test -f dist/index.d.ts
          npx --yes publint
